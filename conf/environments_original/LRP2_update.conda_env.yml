name: LRP2_update
channels:
  - conda-forge
  - bioconda
  
dependencies:
  # Core tools with specific versions
  - python>=3.10,<=3.11
  - r-base=4.4
  - perl=5.32.1
  
  # Python packages
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy<=1.11.4
  - biopython<=1.81
  - cython=3.0.11
  - pysam=0.22.1
  - psutil=6.1.0
  - bx-python=0.11.0
  - pybedtools=0.10.0
  - pytest=7.4.4
  - seaborn=0.13.2
  - scikit-learn=1.5.2
  
  # Bioinformatics tools
  - bcbio-gff=0.7.1
  - bedtools=2.31.1
  - samtools=1.21
  - minimap2=2.28
  - gmap=2024.11.20
  - star=2.7.11b
  - kallisto
  - gffread=0.12.7
  - seqtk=1.4
  - desalt=1.5.6
  - slamem=0.8.5
  - argcomplete=3.4.0
  - gtftools=0.9.0
  - jinja2=3.1.4
  
  # R packages
  - r-tidyverse
  - r-data.table
  - r-ggplotify
  - r-gridbase
  - r-gridextra
  - r-htmltools
  - r-jsonlite
  - r-optparse
  - r-plotly
  - r-plyr
  - r-randomForest
  - r-rmarkdown
  - r-reshape
  - r-scales
  - r-stringi
  - r-biocmanager
  - r-caret
  - bioconductor-rtracklayer
  - bioconductor-biostrings
  - bioconductor-noiseq
  - bioconductor-biobase
  - bioconductor-biocgenerics
  - bioconductor-genomicranges
  - bioconductor-txdbmaker
  - bioconductor-genomicfeatures
  
  # System dependencies (required by R packages)
  - openssl
  - pandoc
  
  # Pip packages
  - pip=24.3.1
  - pip:
    - argh==0.31.3
    - dill==0.3.9
    - edlib==1.3.9.post1
    - gffutils==0.13
    - gtfparse==2.5.0
    - importlib-metadata==8.5.0
    - intervaltree==3.1.0
    - parasail==1.3.4
    - pdf2image==1.17.0
    - polars==0.20.31
    - pyarrow==14.0.2
    - pyfaidx==0.8.1.3
    - simplejson==3.19.3
    - sortedcontainers==2.4.0
    - ultra-bioinformatics==0.1
    - zipp==3.21.0
    - TD2==1.0.6
    - cpat==3.0.4
    
variables:
  - R_LIBS_USER: ""