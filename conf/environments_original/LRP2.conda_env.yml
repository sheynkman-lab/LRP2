name: LRP2
channels:
  - conda-forge
  - bioconda
  - anaconda
  - r
  - defaults
  
dependencies:
  # Core tools with specific versions
  - python>=3.10,<=3.11
  - r>=4.3.0
  - perl=5.32.1
  
  # Python packages
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy<=1.11.4
  - biopython<=1.81
  - cython=3.0.11
  - pysam=0.22.1
  - psutil=6.1.0
  - bx-python=0.11.0
  - pybedtools=0.10.0
  - pytest=7.4.4
  
  # Bioinformatics tools
  - bcbio-gff=0.7.1
  - bedtools=2.31.1
  - samtools=1.21
  - minimap2=2.28
  - gmap=2024.11.20
  - star=2.7.11b
  - kallisto=0.48.0
  - gffread=0.12.7
  - seqtk=1.4
  - desalt=1.5.6
  - slamem=0.8.5
  - argcomplete=3.4.0
  - gtftools=0.9.0
  - jinja2=3.1.4
  - seaborn=0.13.2
  - scikit-learn=1.5.2
  
  # R packages
  - r-tidyverse=2.0.0
  - r-data.table=1.15.2
  - r-dt=0.33
  - r-devtools=2.4.5
  - r-e1071=1.7_16
  - r-ggplotify=0.1.2
  - r-gridbase=0.4_7
  - r-gridextra=2.3
  - r-htmltools=0.5.8.1
  - r-jsonlite=1.8.9
  - r-optparse=1.7.5
  - r-plotly=4.10.4
  - r-plyr=1.8.9
  - r-randomForest=4.7
  - r-rmarkdown=2.29
  - r-reshape=0.8.9
  - r-scales=1.3.0
  - r-stringi=1.8.4
  - r-biocmanager=1.30.25
  - r-caret=6.0_94
  - bioconductor-rtracklayer=1.62.0
  - bioconductor-biostrings=2.70.1
  - bioconductor-noiseq=2.46.0
  - bioconductor-biobase=2.62.0
  - bioconductor-biocgenerics=0.48.1
  - bioconductor-busparse=1.16.0
  
  # System dependencies (required by R packages)
  - openssl=3.4.0 
  - pandoc=3.5
  
  # Pip packages
  - pip=24.3.1
  - pip:
    - argh==0.31.3
    - dill==0.3.9
    - edlib==1.3.9.post1
    - gffutils==0.13
    - gtfparse==2.5.0
    - importlib-metadata==8.5.0
    - intervaltree==3.1.0
    - parasail==1.3.4
    - pdf2image==1.17.0
    - polars==0.20.31
    - pyarrow==14.0.2
    - pyfaidx==0.8.1.3
    - simplejson==3.19.3
    - sortedcontainers==2.4.0
    - ultra-bioinformatics==0.1
    - zipp==3.21.0
    - TD2==1.0.6
    - cpat==3.0.4
    
variables:
  - R_LIBS_USER: ""