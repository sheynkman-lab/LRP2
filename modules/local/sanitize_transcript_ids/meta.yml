# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "sanitize_transcript_ids"
description: Sanitizes transcript IDs by replacing _PAR_Y suffixes with -PAR-Y in GTF or count files
keywords:
  - gtf
  - gencode
  - sanitize
  - transcript
  - pary

tools:
  - sed:
      description: Stream editor for filtering and transforming text
      homepage: https://www.gnu.org/software/sed/
      documentation: https://www.gnu.org/software/sed/manual/sed.html
      licence: ["GPL-3.0-or-later"]
  - awk:
      description: Pattern scanning and processing language
      homepage: https://www.gnu.org/software/gawk/
      documentation: https://www.gnu.org/software/gawk/manual/
      licence: ["GPL-3.0-or-later"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - input_file:
        type: file
        description: GTF annotation file or count matrix file

output:
  sanitized:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*_sanitized.*":
          type: file
          description: Sanitized file with -PAR-Y instead of _PAR_Y
          pattern: "*_sanitized.*"
  versions:
    - - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@JTL-lab"
maintainers:
  - "@JTL-lab"
