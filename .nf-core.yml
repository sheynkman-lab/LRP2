repository_type: pipeline

nf_core_version: 3.4.1

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-lrp2_logo_light.png
    - docs/images/nf-core-lrp2_logo_light.png
    - docs/images/nf-core-lrp2_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-lrp2_logo_light.png
    - docs/images/nf-core-lrp2_logo_light.png
    - docs/images/nf-core-lrp2_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: sheynkmanlab
  name: lrp2
  description: Long-read proteogenomics pipeline for PacBio Iso-Seq data
  author: Megan Schertzer, Julia Lewandowski
  version: 1.0.0dev
  force: true
  outdir: nf-core-lrp2
  is_nfcore: false
