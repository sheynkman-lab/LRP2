name: Integration Tests
on:
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.png"
      - "**/*.svg"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "CITATION.cff"
      - ".gitignore"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.png"
      - "**/*.svg"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "CITATION.cff"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      fragpipe_token:
        description: 'FragPipe token (6 digits, expires ~20 min after it is emailed). Only needed when the FragPipe tools cache is empty or expired. Run from main so every branch can use the cache.'
        required: false
        type: string

# Cancel if a newer run is started
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# bash with -eo pipefail (the default "bash -e" has no pipefail)
defaults:
  run:
    shell: bash

env:
  NXF_ANSI_LOG: false
  NXF_SINGULARITY_CACHEDIR: ${{ github.workspace }}/.singularity
  NXF_SINGULARITY_LIBRARYDIR: ${{ github.workspace }}/.singularity
  # Prefix for the FragPipe tools cache. Each successful download saves a new entry under
  # this prefix; restores pick the newest one. Bump the version to force a fresh download.
  FRAGPIPE_CACHE_PREFIX: Linux-fragpipe-tools-v2-
  APPTAINER_VERSION: "1.3.6"

jobs:
  # ---------------------------------------------------------------------------
  # Fast checks that catch configuration bugs in seconds instead of mid-pipeline
  # ---------------------------------------------------------------------------
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Container directives must work with both Docker and Singularity
        run: |
          # Docker rejects image names that start with docker:// ("invalid reference format").
          # Nextflow adds docker:// automatically when running with Singularity/Apptainer,
          # so modules and configs should use plain names like 'docker.io/org/image:tag'.
          # Any quoted docker:// string counts (module directives, withName/withLabel overrides,
          # process.container, params), except comments and engine-aware ternaries.
          BAD=$(grep -rnE --include='*.nf' --include='*.config' "['\"]docker://" . \
            | grep -vE "^[^:]+:[0-9]+:[[:space:]]*(//|\*|/\*)" \
            | grep -v "containerEngine" || true)
          if [[ -n "$BAD" ]]; then
            echo "::error::A docker:// image reference breaks the Docker engine. Drop the prefix (e.g. 'docker.io/jtllab/lrp2-lite:latest'); Nextflow adds it automatically for Singularity."
            echo "$BAD"
            exit 1
          fi
          echo "All container directives are engine-neutral."

      - name: Test data used by this workflow exists
        run: |
          missing=0
          for f in \
            test_data/run_rna_only/samplesheet_rna_only.csv \
            test_data/run_fragpipe_rna_dda/samplesheet_fragpipe_rna.csv
          do
            if [[ -f "$f" ]]; then
              echo "OK: $f"
            else
              echo "::error file=${f}::Test data file referenced by integration_tests.yml is missing: ${f}"
              missing=1
            fi
          done
          exit "$missing"

  # ---------------------------------------------------------------------------
  # Restore FragPipe tools from cache, or download them once with a token.
  # Every FragPipe-dependent job restores from this single cache entry.
  # The tools are licensed: they live only in the Actions cache (not downloadable
  # through the UI/API) and are never uploaded as artifacts.
  # ---------------------------------------------------------------------------
  fragpipe-setup:
    name: "FragPipe tools: restore or download"
    runs-on: ubuntu-24.04
    outputs:
      available: ${{ steps.status.outputs.available }}
    steps:
      - name: Restore FragPipe tools from cache
        uses: actions/cache/restore@v4
        with:
          path: fragpipe_tools
          key: ${{ env.FRAGPIPE_CACHE_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.FRAGPIPE_CACHE_PREFIX }}

      - name: Validate cached tools
        id: validate
        run: |
          valid=true
          for pattern in "msfragger/MSFragger*.jar" "ionquant/IonQuant*.jar" "diatracer/diaTracer*.jar"; do
            jar=$(compgen -G "fragpipe_tools/${pattern}" | head -n 1 || true)
            if [[ -n "$jar" ]] && unzip -tqq "$jar" > /dev/null 2>&1; then
              echo "OK: ${jar}"
            else
              echo "Missing or corrupt: fragpipe_tools/${pattern}"
              valid=false
            fi
          done
          echo "valid=${valid}" >> "$GITHUB_OUTPUT"

      - name: Download FragPipe tools with token
        id: download
        if: steps.validate.outputs.valid != 'true'
        env:
          FRAGPIPE_TOKEN_INPUT: ${{ inputs.fragpipe_token }}
          FRAGPIPE_TOKEN_SECRET: ${{ secrets.FRAGPIPE_TOKEN }}
        run: |
          TOKEN="${FRAGPIPE_TOKEN_INPUT:-${FRAGPIPE_TOKEN_SECRET:-}}"
          if [[ -z "$TOKEN" ]]; then
            echo "::warning::No valid FragPipe tools cache and no token (FRAGPIPE_TOKEN secret or workflow_dispatch input). FragPipe-dependent tests (test_dda, test_dia, S5) will be skipped."
            echo "downloaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::${TOKEN}"
          if [[ ! "$TOKEN" =~ ^[0-9]{6}$ ]]; then
            echo "::error::The FragPipe token must be exactly 6 digits."
            exit 1
          fi

          BASE="https://msfragger-upgrader.nesvilab.org"
          WORK="${RUNNER_TEMP}/fragpipe_download"
          rm -rf fragpipe_tools "$WORK"
          mkdir -p fragpipe_tools/msfragger fragpipe_tools/ionquant fragpipe_tools/diatracer "$WORK"

          token_rejected() {
            echo "::error::The ${1} download failed, so the FragPipe token was rejected (tokens expire about 20 minutes after being emailed). Request a new token, update the FRAGPIPE_TOKEN secret (or use the workflow_dispatch input), and re-run promptly."
            exit 1
          }

          # fetch_tool <label> <server endpoint> <target subdir> <jar name pattern>
          fetch_tool() {
            local label="$1" endpoint="$2" subdir="$3" pattern="$4"
            local version zip jar
            version=$(curl -fsSL --retry 3 "${BASE}/${endpoint}/latest_version.php")
            echo "Latest ${label} version: ${version}"
            zip="${WORK}/${subdir}.zip"
            curl -fsSL --retry 3 -o "$zip" \
              "${BASE}/${endpoint}/download.php?token=${TOKEN}&download=${version// /%20}%24zip" \
              || token_rejected "$label"
            unzip -tqq "$zip" > /dev/null 2>&1 || token_rejected "$label"
            unzip -qo "$zip" -d "${WORK}/${subdir}"
            jar=$(find "${WORK}/${subdir}" -name "$pattern" -print -quit)
            if [[ -z "$jar" ]]; then
              echo "::error::No ${pattern} found inside the ${label} archive."
              exit 1
            fi
            cp "$jar" "fragpipe_tools/${subdir}/"
            echo "${label}: $(basename "$jar")"
          }

          fetch_tool MSFragger upgrader  msfragger 'MSFragger*.jar'
          fetch_tool IonQuant  ionquant  ionquant  'IonQuant*.jar'
          fetch_tool diaTracer diatracer diatracer 'diaTracer*.jar'

          # Same versions.yml the FRAGPIPE_AUTHENTICATE module writes, so that a storeDir
          # lookup in fragpipe_tools_dir finds every declared output.
          jar_version() {
            local f
            f=$(basename "$(compgen -G "fragpipe_tools/$1/$2*.jar" | head -n 1)" .jar)
            echo "${f#"$2"-}"
          }
          {
            echo '"SHEYNKMANLAB_LRP2:LRP2:PROTEOMICS:FRAGPIPE_AUTHENTICATE":'
            echo "    curl: $(curl --version | awk 'NR == 1 { print $2 }')"
            echo "    msfragger: $(jar_version msfragger MSFragger)"
            echo "    ionquant: $(jar_version ionquant IonQuant)"
            echo "    diatracer: $(jar_version diatracer diaTracer)"
          } > fragpipe_tools/versions.yml

          rm -rf "$WORK"
          ls -lR fragpipe_tools
          echo "downloaded=true" >> "$GITHUB_OUTPUT"

      - name: Save FragPipe tools to cache
        if: steps.download.outputs.downloaded == 'true'
        uses: actions/cache/save@v4
        with:
          path: fragpipe_tools
          key: ${{ env.FRAGPIPE_CACHE_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}

      - name: Report FragPipe availability
        id: status
        if: always()
        env:
          CACHE_VALID: ${{ steps.validate.outputs.valid }}
        run: |
          available=true
          for pattern in "msfragger/MSFragger*.jar" "ionquant/IonQuant*.jar" "diatracer/diaTracer*.jar"; do
            compgen -G "fragpipe_tools/${pattern}" > /dev/null || available=false
          done
          echo "available=${available}" >> "$GITHUB_OUTPUT"
          {
            echo "## FragPipe tools"
            echo ""
            if [[ "$available" == "true" ]]; then
              if [[ "$CACHE_VALID" == "true" ]]; then SOURCE="cache"; else SOURCE="fresh download"; fi
              echo "Available (source: ${SOURCE})."
            else
              echo "**Not available** - test_dda, test_dia and S5 are skipped."
              echo ""
              echo "To enable them: request a FragPipe token, then either update the FRAGPIPE_TOKEN"
              echo "secret and re-run within ~20 minutes, or run this workflow manually on main and"
              echo "paste the token into the fragpipe_token input."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Stage 1: Full pipeline tests with test_rna, test_dda, and test_dia profiles
  # ---------------------------------------------------------------------------
  full-pipeline-test:
    name: "Full Pipeline: ${{ matrix.test_profile }}${{ matrix.genome_version && format(' ({0})', matrix.genome_version) || '' }} | ${{ matrix.container_engine }} | NXF ${{ matrix.NXF_VER }}"
    needs: [fragpipe-setup]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test_profile: [test_rna, test_dda, test_dia]
        container_engine: [docker, singularity]
        NXF_VER:
          - "25.04.0"
        genome_version: [null]
        include:
          # Add GENCODE V40 test for test_rna profile to test _PAR_Y ID handling
          - test_profile: test_rna
            container_engine: docker
            NXF_VER: "25.04.0"
            genome_version: "GRCh38.p13.v40"
          - test_profile: test_rna
            container_engine: singularity
            NXF_VER: "25.04.0"
            genome_version: "GRCh38.p13.v40"
    env:
      TEST_PROFILE: ${{ matrix.test_profile }}
      CONTAINER_ENGINE: ${{ matrix.container_engine }}
      GENOME_VERSION: ${{ matrix.genome_version }}
      NXF_VER: ${{ matrix.NXF_VER }}
      USES_FRAGPIPE: ${{ matrix.test_profile == 'test_dda' || matrix.test_profile == 'test_dia' }}
      FRAGPIPE_AVAILABLE: ${{ needs.fragpipe-setup.outputs.available == 'true' }}

    steps:
      - name: Decide whether this test can run
        run: |
          if [[ "$USES_FRAGPIPE" == "true" && "$FRAGPIPE_AVAILABLE" != "true" ]]; then
            echo "RUN_TEST=false" >> "$GITHUB_ENV"
            echo "::warning::Skipping ${TEST_PROFILE} (${CONTAINER_ENGINE}): FragPipe tools are not available. See the 'FragPipe tools' job."
            {
              echo "## Test Skipped: ${TEST_PROFILE} | ${CONTAINER_ENGINE}"
              echo ""
              echo "FragPipe tools were not available. See the **FragPipe tools: restore or download** job summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "RUN_TEST=true" >> "$GITHUB_ENV"
          fi

      - name: Free up disk space
        if: env.RUN_TEST == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Checkout code
        if: env.RUN_TEST == 'true'
        uses: actions/checkout@v4

      - name: Set up Java
        if: env.RUN_TEST == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Nextflow
        if: env.RUN_TEST == 'true'
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.NXF_VER }}

      # The container engine is enabled through this config instead of -profile docker/singularity,
      # so runOptions from nextflow.config's engine profiles are not loaded.
      - name: Write Nextflow container-engine config
        if: env.RUN_TEST == 'true'
        run: |
          CONFIG="${RUNNER_TEMP}/ci_${CONTAINER_ENGINE}.config"
          if [[ "$CONTAINER_ENGINE" == "docker" ]]; then
            printf '%s\n' \
              "docker.enabled      = true" \
              "docker.runOptions   = ''" \
              "singularity.enabled = false" \
              "apptainer.enabled   = false" > "$CONFIG"
          else
            # autoMounts lets Nextflow bind each task's work dir and staged inputs.
            # --no-home/--cleanenv keep the runner's home dir and env (e.g. JAVA_HOME) out of containers.
            printf '%s\n' \
              "singularity.enabled    = true" \
              "singularity.autoMounts = true" \
              "singularity.runOptions = '--no-home --cleanenv'" \
              "apptainer.enabled      = false" \
              "docker.enabled         = false" > "$CONFIG"
            mkdir -p "$NXF_SINGULARITY_CACHEDIR"
          fi
          echo "NXF_CI_CONFIG=${CONFIG}" >> "$GITHUB_ENV"
          echo "Nextflow CI config (${CONFIG}):"
          cat "$CONFIG"

      # Ubuntu 24.04 uses AppArmor to block unprivileged user namespaces, which Apptainer needs to
      # start containers ("Failed to create container process: Operation not permitted").
      - name: Allow unprivileged user namespaces for Apptainer
        if: env.RUN_TEST == 'true' && matrix.container_engine == 'singularity'
        run: |
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user true && echo "Unprivileged user namespaces are available."

      - name: Set up Apptainer
        if: env.RUN_TEST == 'true' && matrix.container_engine == 'singularity'
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: ${{ env.APPTAINER_VERSION }}

      - name: Cache Singularity images
        if: env.RUN_TEST == 'true' && matrix.container_engine == 'singularity'
        uses: actions/cache@v4
        with:
          path: ${{ env.NXF_SINGULARITY_CACHEDIR }}
          key: ${{ runner.os }}-singularity-${{ matrix.test_profile }}-${{ hashFiles('**/nextflow.config', '**/modules.config', 'modules/**/main.nf') }}
          restore-keys: |
            ${{ runner.os }}-singularity-${{ matrix.test_profile }}-
            ${{ runner.os }}-singularity-

      - name: Restore FragPipe tools
        if: env.RUN_TEST == 'true' && env.USES_FRAGPIPE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: fragpipe_tools
          key: ${{ env.FRAGPIPE_CACHE_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.FRAGPIPE_CACHE_PREFIX }}
          fail-on-cache-miss: true

      - name: Display resource information
        if: env.RUN_TEST == 'true'
        run: |
          echo "CPUs: $(nproc)"
          free -h
          df -h /
          if command -v docker > /dev/null; then docker --version; fi
          if command -v apptainer > /dev/null; then apptainer --version; fi
          nextflow -version
          if [[ -d fragpipe_tools ]]; then ls -lR fragpipe_tools; fi

      - name: Run full pipeline test - ${{ matrix.test_profile }} with ${{ matrix.container_engine }}
        id: run_test
        if: env.RUN_TEST == 'true'
        env:
          FRAGPIPE_TOKEN_INPUT: ${{ inputs.fragpipe_token }}
          FRAGPIPE_TOKEN_SECRET: ${{ secrets.FRAGPIPE_TOKEN }}
        run: |
          OUTDIR="test_results_${TEST_PROFILE}_${CONTAINER_ENGINE}${GENOME_VERSION:+_${GENOME_VERSION}}"
          echo "OUTDIR=${OUTDIR}" >> "$GITHUB_ENV"
          LABEL="${TEST_PROFILE}${GENOME_VERSION:+ (${GENOME_VERSION})} | ${CONTAINER_ENGINE}"

          args=(run "$GITHUB_WORKSPACE" -profile "$TEST_PROFILE" --outdir "$OUTDIR" -c "$NXF_CI_CONFIG")
          if [[ -n "$GENOME_VERSION" ]]; then
            args+=(--genome "$GENOME_VERSION")
          fi
          if [[ "$USES_FRAGPIPE" == "true" ]]; then
            args+=(--fragpipe_license_accept true)
            # Tools come from fragpipe_tools/ (restored above). A token is passed too when one
            # exists; if it is still fresh, FRAGPIPE_AUTHENTICATE can use it as a fallback.
            TOKEN="${FRAGPIPE_TOKEN_INPUT:-${FRAGPIPE_TOKEN_SECRET:-}}"
            if [[ -n "$TOKEN" ]]; then
              echo "::add-mask::${TOKEN}"
              args+=(--fragpipe_token "$TOKEN")
            fi
          fi

          echo "=========================================="
          echo "Running: ${LABEL} | NXF ${NXF_VER}"
          echo "Start time: $(date -u)"
          echo "=========================================="

          set +e
          nextflow "${args[@]}"
          EXIT_CODE=$?
          set -e

          echo "End time: $(date -u) | Exit code: ${EXIT_CODE}"
          if [[ "$EXIT_CODE" -eq 0 ]]; then
            echo "::notice::Full pipeline test PASSED: ${LABEL}"
            RESULT="Passed"
          else
            echo "::error::Full pipeline test FAILED: ${LABEL}"
            RESULT="Failed"
          fi
          {
            echo "## Test ${RESULT}: ${LABEL}"
            echo ""
            echo "**Nextflow Version:** ${NXF_VER}"
            echo "**Finished:** $(date -u)"
            if [[ "$EXIT_CODE" -ne 0 ]]; then
              echo ""
              echo "Check the job log and the logs-full-pipeline-* artifact for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$EXIT_CODE"

      # Docker-run outputs feed the Stage 2 entry-point tests. JARs are excluded so no
      # licensed FragPipe component can end up in a downloadable artifact.
      - name: Upload pipeline outputs as artifacts
        if: steps.run_test.outcome == 'success' && matrix.container_engine == 'docker'
        uses: actions/upload-artifact@v4
        with:
          name: full-pipeline-outputs-${{ matrix.test_profile }}${{ matrix.genome_version && format('-{0}', matrix.genome_version) || '' }}
          path: |
            ${{ env.OUTDIR }}/
            !${{ env.OUTDIR }}/**/*.jar
          retention-days: 7

      # .nextflow.log and .command.* are hidden files, which upload-artifact skips unless told otherwise.
      - name: Upload pipeline logs on failure
        if: failure() && steps.run_test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: logs-full-pipeline-${{ matrix.test_profile }}${{ matrix.genome_version && format('-{0}', matrix.genome_version) || '' }}-${{ matrix.container_engine }}-${{ matrix.NXF_VER }}
          path: |
            .nextflow.log
            ${{ env.OUTDIR }}/pipeline_info/
            work/**/.command.log
            work/**/.command.err
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload execution reports on success
        if: steps.run_test.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: reports-full-pipeline-${{ matrix.test_profile }}${{ matrix.genome_version && format('-{0}', matrix.genome_version) || '' }}-${{ matrix.container_engine }}-${{ matrix.NXF_VER }}
          path: |
            ${{ env.OUTDIR }}/pipeline_info/execution_report*.html
            ${{ env.OUTDIR }}/pipeline_info/execution_timeline*.html
            ${{ env.OUTDIR }}/multiqc/multiqc_report.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean up work directory
        if: always() && env.RUN_TEST == 'true'
        run: |
          echo "Cleaning up work directory to free space..."
          sudo rm -rf work || true
          df -h /

  # ---------------------------------------------------------------------------
  # Stage 2: Entry point tests (S2, S4, S5) using Stage 1 docker outputs
  # ---------------------------------------------------------------------------
  entry-point-test:
    name: "${{ matrix.entry_point }} Entry Point: ${{ matrix.container_engine }} | NXF ${{ matrix.NXF_VER }}"
    needs: [fragpipe-setup, full-pipeline-test]
    # Run even if some Stage 1 legs failed; each entry point only needs its own upstream artifact.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        entry_point: [S2, S4, S5]
        container_engine: [docker, singularity]
        NXF_VER:
          - "25.04.0"
        include:
          - entry_point: S2
            slug: s2
            upstream_profile: test_rna
          - entry_point: S4
            slug: s4
            upstream_profile: test_rna
          - entry_point: S5
            slug: s5
            upstream_profile: test_dda
    env:
      ENTRY_POINT: ${{ matrix.entry_point }}
      CONTAINER_ENGINE: ${{ matrix.container_engine }}
      UPSTREAM_PROFILE: ${{ matrix.upstream_profile }}
      NXF_VER: ${{ matrix.NXF_VER }}
      USES_FRAGPIPE: ${{ matrix.entry_point == 'S5' }}
      FRAGPIPE_AVAILABLE: ${{ needs.fragpipe-setup.outputs.available == 'true' }}

    steps:
      - name: Decide whether this test can run
        run: |
          if [[ "$USES_FRAGPIPE" == "true" && "$FRAGPIPE_AVAILABLE" != "true" ]]; then
            echo "RUN_TEST=false" >> "$GITHUB_ENV"
            echo "::warning::Skipping ${ENTRY_POINT} entry point (${CONTAINER_ENGINE}): FragPipe tools are not available."
            {
              echo "## Test Skipped: ${ENTRY_POINT} Entry Point | ${CONTAINER_ENGINE}"
              echo ""
              echo "FragPipe tools were not available. See the **FragPipe tools: restore or download** job summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "RUN_TEST=true" >> "$GITHUB_ENV"
          fi

      - name: Free up disk space
        if: env.RUN_TEST == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Checkout code
        if: env.RUN_TEST == 'true'
        uses: actions/checkout@v4

      - name: Set up Java
        if: env.RUN_TEST == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Nextflow
        if: env.RUN_TEST == 'true'
        uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ matrix.NXF_VER }}

      - name: Write Nextflow container-engine config
        if: env.RUN_TEST == 'true'
        run: |
          CONFIG="${RUNNER_TEMP}/ci_${CONTAINER_ENGINE}.config"
          if [[ "$CONTAINER_ENGINE" == "docker" ]]; then
            printf '%s\n' \
              "docker.enabled      = true" \
              "docker.runOptions   = ''" \
              "singularity.enabled = false" \
              "apptainer.enabled   = false" > "$CONFIG"
          else
            printf '%s\n' \
              "singularity.enabled    = true" \
              "singularity.autoMounts = true" \
              "singularity.runOptions = '--no-home --cleanenv'" \
              "apptainer.enabled      = false" \
              "docker.enabled         = false" > "$CONFIG"
            mkdir -p "$NXF_SINGULARITY_CACHEDIR"
          fi
          echo "NXF_CI_CONFIG=${CONFIG}" >> "$GITHUB_ENV"
          echo "Nextflow CI config (${CONFIG}):"
          cat "$CONFIG"

      - name: Allow unprivileged user namespaces for Apptainer
        if: env.RUN_TEST == 'true' && matrix.container_engine == 'singularity'
        run: |
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user true && echo "Unprivileged user namespaces are available."

      - name: Set up Apptainer
        if: env.RUN_TEST == 'true' && matrix.container_engine == 'singularity'
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: ${{ env.APPTAINER_VERSION }}

      # Restore-only: reuse the Stage 1 image cache instead of saving more multi-GB entries
      # (the repository cache limit is 10 GB, shared with the FragPipe tools cache).
      - name: Restore Singularity images from Stage 1 cache
        if: env.RUN_TEST == 'true' && matrix.container_engine == 'singularity'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NXF_SINGULARITY_CACHEDIR }}
          key: ${{ runner.os }}-singularity-${{ matrix.upstream_profile }}-${{ hashFiles('**/nextflow.config', '**/modules.config', 'modules/**/main.nf') }}
          restore-keys: |
            ${{ runner.os }}-singularity-${{ matrix.upstream_profile }}-

      - name: Restore FragPipe tools
        if: env.RUN_TEST == 'true' && env.USES_FRAGPIPE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: fragpipe_tools
          key: ${{ env.FRAGPIPE_CACHE_PREFIX }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.FRAGPIPE_CACHE_PREFIX }}
          fail-on-cache-miss: true

      - name: Download ${{ matrix.upstream_profile }} outputs from Stage 1
        id: download_upstream
        if: env.RUN_TEST == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: full-pipeline-outputs-${{ matrix.upstream_profile }}
          path: stage1_outputs/

      - name: Check Stage 1 outputs are available
        if: env.RUN_TEST == 'true' && steps.download_upstream.outcome != 'success'
        run: |
          echo "::error::Artifact 'full-pipeline-outputs-${UPSTREAM_PROFILE}' was not found. The '${UPSTREAM_PROFILE} | docker' Stage 1 job failed or was skipped, so the ${ENTRY_POINT} entry point cannot be tested. Fix that job first."
          exit 1

      - name: Run ${{ matrix.entry_point }} entry point test with ${{ matrix.container_engine }}
        id: run_test
        if: env.RUN_TEST == 'true'
        env:
          FRAGPIPE_TOKEN_INPUT: ${{ inputs.fragpipe_token }}
          FRAGPIPE_TOKEN_SECRET: ${{ secrets.FRAGPIPE_TOKEN }}
        run: |
          OUTDIR="test_results_${ENTRY_POINT,,}_entry_${CONTAINER_ENGINE}"
          echo "OUTDIR=${OUTDIR}" >> "$GITHUB_ENV"
          LABEL="${ENTRY_POINT} Entry Point | ${CONTAINER_ENGINE}"

          find_one() { find "$1" -name "$2" -print -quit 2> /dev/null || true; }
          missing=0
          # need <description> <value> <directory searched>
          need() {
            if [[ -z "$2" ]]; then
              echo "::error::${ENTRY_POINT}: required input not found: ${1} (searched ${3})"
              echo "Contents of ${3}:"
              ls -R "$3" 2> /dev/null || echo "(directory not found)"
              missing=1
            else
              echo "${1}: ${2}"
            fi
          }

          args=(run "$GITHUB_WORKSPACE")
          case "$ENTRY_POINT" in
            S2)
              S1_DIR="stage1_outputs/S1_PACBIO_ISOCALL/M5_ISOCALL_CALL"
              S2_GTF=$(find_one "$S1_DIR" '*.gtf')
              S2_COUNTS=$(find_one "$S1_DIR" '*_counts.tsv')
              need "S2 GTF (*.gtf)" "$S2_GTF" "$S1_DIR"
              need "S2 counts (*_counts.tsv)" "$S2_COUNTS" "$S1_DIR"
              args+=(
                --input test_data/run_rna_only/samplesheet_rna_only.csv
                --S2_custom_gtf "$S2_GTF"
                --S2_custom_counts "$S2_COUNTS"
                --genome GRCh38.p14.v49
                --dataset_name lrptest_s2
              )
              ;;
            S4)
              S2_M3_DIR="stage1_outputs/S2_TRANSCRIPTOME/M3_FILTER_TRANSCRIPTOME"
              S3_M4_DIR="stage1_outputs/S3_PREDICTED_PROTEOME/M4_PROTEIN_CLASSIFICATION"
              S4_GTF=$(find_one "$S2_M3_DIR" '*.filtered.gtf')
              S4_COUNTS=$(find_one "$S2_M3_DIR" '*filtered_hashids_with_cpm.txt')
              S4_ORF_COUNTS=$(find_one "$S3_M4_DIR" '*collapsed_high_confidence_ORF_hashids_with_cpm.txt')
              need "S4 GTF (*.filtered.gtf)" "$S4_GTF" "$S2_M3_DIR"
              need "S4 counts (*filtered_hashids_with_cpm.txt)" "$S4_COUNTS" "$S2_M3_DIR"
              need "S4 ORF counts (*collapsed_high_confidence_ORF_hashids_with_cpm.txt)" "$S4_ORF_COUNTS" "$S3_M4_DIR"
              args+=(
                --S4_multisample_metadata test_data/run_rna_only/samplesheet_rna_only.csv
                --S4_custom_gtf "$S4_GTF"
                --S4_custom_counts "$S4_COUNTS"
                --S4_custom_orf_counts "$S4_ORF_COUNTS"
                --dataset_name lrptest_s4
              )
              ;;
            S5)
              # Protein-only samplesheet built from the test_dda samplesheet. It is written next to
              # the source so relative sample paths resolve the same way.
              SRC="test_data/run_fragpipe_rna_dda/samplesheet_fragpipe_rna.csv"
              SHEET="$(dirname "$SRC")/samplesheet_protein_only_ci.csv"
              if [[ ! -f "$SRC" ]]; then
                echo "::error::Source samplesheet not found: ${SRC}"
                exit 1
              fi
              awk -F',' '
                { sub(/\r$/, "") }
                NR == 1 { for (i = 1; i <= NF; i++) if ($i == "sample_type") col = i; print; next }
                col && $col == "protein"
              ' "$SRC" > "$SHEET"
              N_PROTEIN=$(( $(wc -l < "$SHEET") - 1 ))
              echo "Protein-only samplesheet (${N_PROTEIN} sample row(s)):"
              cat "$SHEET"
              if (( N_PROTEIN < 1 )); then
                echo "::error::No rows with sample_type == protein in ${SRC}"
                missing=1
              fi

              S2_M3_DIR="stage1_outputs/S2_TRANSCRIPTOME/M3_FILTER_TRANSCRIPTOME"
              S3_M2_DIR="stage1_outputs/S3_PREDICTED_PROTEOME/M2_FILTER_CPAT"
              S3_M4_DIR="stage1_outputs/S3_PREDICTED_PROTEOME/M4_PROTEIN_CLASSIFICATION"
              S5_PROTEIN_FASTA=$(find_one "$S3_M4_DIR" '*best_ORF.fa')
              S5_CDS_GTF=$(find_one "$S3_M2_DIR" '*best_ORF.gtf')
              S5_COUNTS=$(find_one "$S2_M3_DIR" '*all_hashids_with_cpm.txt')
              need "S5 protein FASTA (*best_ORF.fa)" "$S5_PROTEIN_FASTA" "$S3_M4_DIR"
              need "S5 CDS GTF (*best_ORF.gtf)" "$S5_CDS_GTF" "$S3_M2_DIR"
              args+=(
                --input "$SHEET"
                --S5_custom_protein_fasta "$S5_PROTEIN_FASTA"
                --S5_custom_cds_gtf "$S5_CDS_GTF"
                --genome GRCh38.p14.v49
                --dataset_name lrptest_s5
                --protein_search fragpipe
                --fragpipe_license_accept true
              )
              if [[ -n "$S5_COUNTS" ]]; then
                echo "S5 counts (*all_hashids_with_cpm.txt): ${S5_COUNTS}"
                args+=(--S5_custom_counts "$S5_COUNTS")
              else
                echo "::warning::S5 counts (*all_hashids_with_cpm.txt) not found in ${S2_M3_DIR}; running without --S5_custom_counts"
              fi
              TOKEN="${FRAGPIPE_TOKEN_INPUT:-${FRAGPIPE_TOKEN_SECRET:-}}"
              if [[ -n "$TOKEN" ]]; then
                echo "::add-mask::${TOKEN}"
                args+=(--fragpipe_token "$TOKEN")
              fi
              ;;
            *)
              echo "::error::Unknown entry point: ${ENTRY_POINT}"
              exit 1
              ;;
          esac

          if (( missing )); then
            echo "::error::${ENTRY_POINT}: required Stage 1 outputs are missing (see above)."
            exit 1
          fi

          args+=(--outdir "$OUTDIR" -c "$NXF_CI_CONFIG")

          echo "=========================================="
          echo "Running: ${LABEL} | NXF ${NXF_VER}"
          echo "Start time: $(date -u)"
          echo "=========================================="

          set +e
          nextflow "${args[@]}"
          EXIT_CODE=$?
          set -e

          echo "End time: $(date -u) | Exit code: ${EXIT_CODE}"
          if [[ "$EXIT_CODE" -eq 0 ]]; then
            echo "::notice::${LABEL} test PASSED"
            RESULT="Passed"
          else
            echo "::error::${LABEL} test FAILED"
            RESULT="Failed"
          fi
          {
            echo "## Test ${RESULT}: ${LABEL}"
            echo ""
            echo "**Nextflow Version:** ${NXF_VER}"
            echo "**Finished:** $(date -u)"
            if [[ "$EXIT_CODE" -ne 0 ]]; then
              echo ""
              echo "Check the job log and the logs-${ENTRY_POINT,,}-entry-* artifact for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$EXIT_CODE"

      - name: Upload pipeline logs on failure
        if: failure() && steps.run_test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.slug }}-entry-${{ matrix.container_engine }}-${{ matrix.NXF_VER }}
          path: |
            .nextflow.log
            ${{ env.OUTDIR }}/pipeline_info/
            work/**/.command.log
            work/**/.command.err
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload execution reports on success
        if: steps.run_test.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.slug }}-entry-${{ matrix.container_engine }}-${{ matrix.NXF_VER }}
          path: |
            ${{ env.OUTDIR }}/pipeline_info/execution_report*.html
            ${{ env.OUTDIR }}/pipeline_info/execution_timeline*.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Clean up work directory
        if: always() && env.RUN_TEST == 'true'
        run: |
          echo "Cleaning up work directory to free space..."
          sudo rm -rf work stage1_outputs || true
          df -h /

  # ---------------------------------------------------------------------------
  # Final confirmation job - every job must succeed; skipped FragPipe tests are flagged
  # ---------------------------------------------------------------------------
  confirm-pass:
    name: All Integration Tests Passed
    needs: [static-checks, fragpipe-setup, full-pipeline-test, entry-point-test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check test results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          FRAGPIPE_AVAILABLE: ${{ needs.fragpipe-setup.outputs.available }}
        run: |
          echo "Job results:"
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<< "$NEEDS_JSON"

          {
            echo "## Integration Test Results"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$NEEDS_JSON"
            echo ""
            echo "Per-configuration details are in each job's summary above."
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$FRAGPIPE_AVAILABLE" != "true" ]]; then
            echo "::warning::FragPipe tools were unavailable: test_dda, test_dia and the S5 entry point were SKIPPED, not tested."
            {
              echo ""
              echo "> **Warning:** FragPipe tools were unavailable, so test_dda, test_dia and the S5 entry point were **skipped**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          NOT_SUCCESS=$(jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")' <<< "$NEEDS_JSON")
          if [[ -n "$NOT_SUCCESS" ]]; then
            echo "::error::These jobs did not succeed: ${NOT_SUCCESS}"
            exit 1
          fi
          echo "All integration test jobs succeeded."