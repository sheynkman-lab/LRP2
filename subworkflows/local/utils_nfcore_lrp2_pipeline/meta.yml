# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "PIPELINE_INITIALISATION"
description: Subworkflow with utility functions specific to the sheynkmanlab/lrp2 pipeline
keywords:
  - utility
  - pipeline
  - initialise
  - validation
  - lrp2
components:
  - utils_nfschema_plugin
  - utils_nfcore_pipeline
  - utils_nextflow_pipeline
  - completionemail
  - completionsummary
input:
  - version:
      type: boolean
      description: |
        Display version and exit
  - validate_params:
      type: boolean
      description: |
        Boolean whether to validate parameters against the schema at runtime
  - monochrome_logs:
      type: boolean
      description: |
        Do not use coloured log outputs
  - nextflow_cli_args:
      type: list
      description: |
        List of positional nextflow CLI args
  - outdir:
      type: string
      description: |
        The output directory where the results will be saved
  - input:
      type: string
      description: |
        Path to input samplesheet
  - help:
      type: boolean
      description: |
        Display help message and exit
  - help_full:
      type: boolean
      description: |
        Show the full help message
  - show_hidden:
      type: boolean
      description: |
        Show hidden parameters in the help message
output:
  - success:
      type: boolean
      description: |
        Dummy output to indicate successful pipeline initialisation
  - versions:
      type: file
      description: |
        File containing software versions
authors:
  - "@JTL-lab"
maintainers:
  - "@JTL-lab"
